<div class="flex justify-center w-full animate-fade-in">
    <form #form="ngForm" (ngSubmit)="onSubmit(form)"
        class="w-full max-w-4xl space-y-8">
        <div class="flex flex-col gap-2">
            <h2 class="text-title">
                {{ mode() === 'update' ? 'Actualizá el paciente' : 'Nuevo paciente' }}
            </h2>
            <p class="text-muted">
                Completá los datos del paciente para dejarlo listo en el sistema.
            </p>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div class="form-group">
                <label for="id" class="form-label">Documento de identidad</label>
                <input type="text" id="id" name="id" required [(ngModel)]="formValues.id"
                    class="form-control"
                    placeholder="Ej. 12345678" />
            </div>

            <div class="form-group">
                <label for="name" class="form-label">Nombre completo</label>
                <input type="text" id="name" name="name" required [(ngModel)]="formValues.name"
                    class="form-control"
                    placeholder="Ej. María López" />
            </div>

            <div class="form-group">
                <label for="email" class="form-label">Correo</label>
                <input type="email" id="email" name="email" required [(ngModel)]="formValues.email"
                    class="form-control"
                    placeholder="correo@ejemplo.com" />
            </div>

            <div class="form-group">
                <label for="phone" class="form-label">Teléfono</label>
                <input type="tel" id="phone" name="phone" required [(ngModel)]="formValues.phone"
                    class="form-control"
                    placeholder="+54 9 11 1234-5678" />
            </div>

            <div class="form-group">
                <label for="birthDate" class="form-label">Fecha de nacimiento</label>
                <input type="date" id="birthDate" name="birthDate" required [(ngModel)]="formValues.birthDate"
                    class="form-control" />
            </div>

            <div class="form-group">
                <label for="gender" class="form-label">Género</label>
                <select id="gender" name="gender" required [(ngModel)]="formValues.gender"
                    class="form-control appearance-none">
                    <option value="" disabled>Seleccione...</option>
                    <option value="male">Masculino</option>
                    <option value="female">Femenino</option>
                    <option value="other">Otro</option>
                </select>
            </div>

            <div class="form-group col-span-1 md:col-span-2">
                <label for="address" class="form-label">Dirección</label>
                <input type="text" id="address" name="address" [(ngModel)]="formValues.address"
                    class="form-control"
                    placeholder="Calle y número" />
            </div>

            <div class="form-group">
                <label for="city" class="form-label">Ciudad</label>
                <input type="text" id="city" name="city" [(ngModel)]="formValues.city"
                    class="form-control"
                    placeholder="Ciudad" />
            </div>

            <div class="form-group">
                <label for="state" class="form-label">Provincia</label>
                <input type="text" id="state" name="state" [(ngModel)]="formValues.state"
                    class="form-control"
                    placeholder="Provincia / Estado" />
            </div>
        </div>

        <div class="flex justify-end gap-3 pt-4 border-t border-[var(--color-border)]">
            <button type="button" (click)="onCancel()" class="btn btn-secondary">
                Cancelar
            </button>
            <button type="submit" [disabled]="!form.valid" class="btn btn-primary">
                {{ buttonLabel }}
            </button>
        </div>
    </form>
</div>
