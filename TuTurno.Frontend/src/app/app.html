<div class="min-h-screen bg-[var(--color-bg-main)] text-[var(--color-text-main)] flex flex-col relative overflow-hidden">
  
  <!-- Particles Background -->
  <div class="particles-container">
    <div class="particle" style="width: 8px; height: 8px; left: 5%; animation-duration: 15s; animation-delay: 0s;"></div>
    <div class="particle" style="width: 4px; height: 4px; left: 15%; animation-duration: 25s; animation-delay: -5s;"></div>
    <div class="particle" style="width: 6px; height: 6px; left: 25%; animation-duration: 20s; animation-delay: -2s;"></div>
    <div class="particle" style="width: 10px; height: 10px; left: 35%; animation-duration: 30s; animation-delay: -10s;"></div>
    <div class="particle" style="width: 5px; height: 5px; left: 45%; animation-duration: 18s; animation-delay: -7s;"></div>
    <div class="particle" style="width: 7px; height: 7px; left: 55%; animation-duration: 22s; animation-delay: -3s;"></div>
    <div class="particle" style="width: 3px; height: 3px; left: 65%; animation-duration: 28s; animation-delay: -15s;"></div>
    <div class="particle" style="width: 9px; height: 9px; left: 75%; animation-duration: 24s; animation-delay: -8s;"></div>
    <div class="particle" style="width: 4px; height: 4px; left: 85%; animation-duration: 35s; animation-delay: -20s;"></div>
    <div class="particle" style="width: 6px; height: 6px; left: 95%; animation-duration: 12s; animation-delay: -4s;"></div>
    <div class="particle" style="width: 5px; height: 5px; left: 12%; animation-duration: 21s; animation-delay: -12s;"></div>
    <div class="particle" style="width: 8px; height: 8px; left: 28%; animation-duration: 16s; animation-delay: -6s;"></div>
    <div class="particle" style="width: 3px; height: 3px; left: 42%; animation-duration: 32s; animation-delay: -18s;"></div>
    <div class="particle" style="width: 7px; height: 7px; left: 68%; animation-duration: 19s; animation-delay: -9s;"></div>
    <div class="particle" style="width: 10px; height: 10px; left: 82%; animation-duration: 27s; animation-delay: -1s;"></div>
  </div>

  <!-- Header -->
  <header *ngIf="!isLoginPage()" class="h-16 bg-[var(--color-bg-sidebar)] border-b border-[var(--color-border)] flex items-center justify-between px-4 sticky top-0 z-50">
    <div class="flex items-center gap-4">
      <button (click)="isSidebarOpen = !isSidebarOpen" class="lg:hidden p-2 hover:bg-gray-100 rounded-lg">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path></svg>
      </button>
      <h1 class="text-xl font-bold text-[var(--color-primary-dark)] tracking-tight">TuTurno</h1>
    </div>

    <div class="flex items-center gap-3">
      <div class="hidden sm:block text-right">
        <p class="text-sm font-semibold">Dr. Usuario</p>
        <p class="text-xs text-[var(--color-text-muted)] font-medium">Administrador</p>
      </div>
      <div class="w-10 h-10 rounded-full bg-[var(--color-primary)] flex items-center justify-center text-white font-bold">
        DU
      </div>
      <button title="Cerrar Sesión" class="p-2 text-[var(--color-text-muted)] hover:text-red-500 transition-colors">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path></svg>
      </button>
    </div>
  </header>

  <div class="flex flex-1 overflow-hidden">
    
    <div *ngIf="isSidebarOpen && !isLoginPage()" (click)="isSidebarOpen = false" class="fixed inset-0 bg-black/20 z-40 lg:hidden backdrop-blur-sm"></div>

    <aside *ngIf="!isLoginPage()" [class.translate-x-0]="isSidebarOpen" [class.-translate-x-full]="!isSidebarOpen"
      class="fixed inset-y-0 left-0 w-64 bg-[var(--color-bg-sidebar)] border-r border-[var(--color-border)] z-40 transform transition-transform duration-300 ease-in-out lg:relative lg:translate-x-0 flex flex-col">
      
      <nav class="flex-1 p-4 space-y-1 overflow-y-auto">
        <a routerLink="/dashboard" routerLinkActive="bg-[var(--color-primary)] text-white" class="flex items-center gap-3 p-3 rounded-xl transition-all font-medium text-[var(--color-text-muted)] hover:bg-sky-50">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path></svg>
          Dashboard
        </a>
        <a routerLink="/citas" routerLinkActive="bg-[var(--color-primary)] text-white" class="flex items-center gap-3 p-3 rounded-xl transition-all font-medium text-[var(--color-text-muted)] hover:bg-sky-50">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
          Citas
        </a>
        <a routerLink="/patients" routerLinkActive="bg-[var(--color-primary)] text-white" class="flex items-center gap-3 p-3 rounded-xl transition-all font-medium text-[var(--color-text-muted)] hover:bg-sky-50">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z"></path></svg>
          Pacientes
        </a>
        <a routerLink="/doctors" routerLinkActive="bg-[var(--color-primary)] text-white" class="flex items-center gap-3 p-3 rounded-xl transition-all font-medium text-[var(--color-text-muted)] hover:bg-sky-50">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19.428 15.428a2 2 0 00-1.022-.547l-2.387-.477a6 6 0 00-3.86.517l-.318.158a6 6 0 01-3.86.517L6.05 15.21a2 2 0 00-1.806.547M8 4h8l-1 1v5.172a2 2 0 00.586 1.414l5 5c1.26 1.26.367 3.414-1.415 3.414H4.828c-1.782 0-2.674-2.154-1.414-3.414l5-5A2 2 0 009 10.172V5L8 4z"></path></svg>
          Médicos
        </a>
        <a routerLink="/specialties" routerLinkActive="bg-[var(--color-primary)] text-white" class="flex items-center gap-3 p-3 rounded-xl transition-all font-medium text-[var(--color-text-muted)] hover:bg-sky-50">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12a3 3 0 116 0 3 3 0 01-6 0zm.5 4h7a3.5 3.5 0 010 7h-7a3.5 3.5 0 010-7zm7-6a5 5 0 10-10 0v4a5 5 0 1010 0V10z" />
          </svg>
          Especialidades
        </a>
        <a routerLink="/offices" routerLinkActive="bg-[var(--color-primary)] text-white" class="flex items-center gap-3 p-3 rounded-xl transition-all font-medium text-[var(--color-text-muted)] hover:bg-sky-50">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4" />
          </svg>
          Oficinas
        </a>
        <a routerLink="/locations" routerLinkActive="bg-[var(--color-primary)] text-white" class="flex items-center gap-3 p-3 rounded-xl transition-all font-medium text-[var(--color-text-muted)] hover:bg-sky-50">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z" />
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z" />
          </svg>
          Locaciones
        </a>
      </nav>

      <div class="p-4 border-t border-[var(--color-border)]">
        <a routerLink="/settings" routerLinkActive="bg-[var(--color-primary)] text-white" class="flex items-center gap-3 p-3 rounded-xl transition-all font-medium text-[var(--color-text-muted)] hover:bg-sky-50">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
          Configuración
        </a>
      </div>
    </aside>

    <main class="flex-1 overflow-y-auto" [class.p-6]="!isLoginPage()" [class.md:p-8]="!isLoginPage()">
      <div [class.max-w-7xl]="!isLoginPage()" [class.mx-auto]="!isLoginPage()">
        <router-outlet></router-outlet>
      </div>
    </main>

  </div>
</div>
