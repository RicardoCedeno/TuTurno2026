<div class="cancellation-container p-6 animate-fade-in">
  <div class="header mb-8">
    <h1 class="text-3xl font-bold text-[var(--color-primary)]">Gestión de Cancelaciones</h1>
    <p class="text-[var(--color-text-muted)]">Filtre y gestione las cancelaciones de citas médicas.</p>
  </div>

  <!-- Filtros -->
  <div class="filters-card bg-[var(--color-bg-card)] border border-[var(--color-border)] rounded-2xl p-6 shadow-sm mb-8">
    <div class="grid grid-cols-1 md:grid-cols-3 gap-6 items-end">
      
      <!-- Paciente -->
      <div class="form-group">
        <label class="form-label block mb-2 text-sm font-medium">Paciente</label>
        <select [(ngModel)]="selectedPatientId" class="form-control w-full">
          <option value="">Todos los pacientes</option>
          @for (p of patients(); track p.id) {
            <option [value]="p.id">{{ p.name }}</option>
          }
        </select>
      </div>

      <!-- Doctor -->
      <div class="form-group">
        <label class="form-label block mb-2 text-sm font-medium">Doctor</label>
        <select [(ngModel)]="selectedDoctorId" class="form-control w-full">
          <option value="">Todos los doctores</option>
          @for (d of doctors(); track d.id) {
            <option [value]="d.id">{{ d.name }}</option>
          }
        </select>
      </div>

      <!-- Botón Consultar -->
      <div class="actions">
        <button (click)="onConsult()" 
          class="btn btn-primary w-full flex items-center justify-center gap-2 h-[42px] cursor-pointer">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
          </svg>
          Consultar
        </button>
      </div>
    </div>
  </div>

  <!-- Listado -->
  @if (searchTrigger()) {
    <app-appointments-cancellation-list 
      [patientId]="searchTrigger()?.patientId || ''" 
      [doctorId]="searchTrigger()?.doctorId || ''"
      [patients]="patients()"
      [doctors]="doctors()">
    </app-appointments-cancellation-list>
  } @else {
    <div class="empty-state text-center py-20 bg-[var(--color-bg-card)] rounded-2xl border border-dashed border-[var(--color-border)]">
      <div class="text-6xl mb-4">🔍</div>
      <h3 class="text-xl font-medium text-[var(--color-text-main)]">Realice una búsqueda</h3>
      <p class="text-[var(--color-text-muted)]">Seleccione un paciente o doctor para ver sus citas y cancelaciones.</p>
    </div>
  }
</div>
