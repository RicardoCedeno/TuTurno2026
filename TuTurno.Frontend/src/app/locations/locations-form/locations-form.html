<form class="space-y-6 animate-fade-in" #form="ngForm" (ngSubmit)="onSubmit(form)">
  <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
    <!-- Información General -->
    <div class="space-y-4">
      <h3 class="text-subtitle font-medium text-[var(--color-primary-dark)] border-b border-[var(--color-border)] pb-2">Información General</h3>

      <div class="form-group">
        <label for="name" class="form-label">Nombre de la Sede</label>
        <input type="text" id="name" name="name" [(ngModel)]="formValues.name" required
          class="form-control"
          placeholder="Ej: Sede Central">
      </div>

      <div class="form-group">
        <label for="phone" class="form-label">Teléfono de Contacto</label>
        <input type="text" id="phone" name="phone" [(ngModel)]="formValues.phone"
          class="form-control"
          placeholder="+54 11 1234-5678">
      </div>

      <div class="flex items-center gap-2 pt-2">
        <input type="checkbox" id="active" name="active" [(ngModel)]="formValues.active"
          class="w-4 h-4 text-[var(--color-primary)] border-[var(--color-border)] rounded focus:ring-[var(--color-primary)]">
        <label for="active" class="text-sm font-medium text-[var(--color-text-main)]">Sede Activa</label>
      </div>
    </div>

    <!-- Ubicación -->
    <div class="space-y-4">
      <h3 class="text-subtitle font-medium text-[var(--color-primary-dark)] border-b border-[var(--color-border)] pb-2">Ubicación</h3>

      <div class="form-group">
        <label for="address" class="form-label">Dirección</label>
        <input type="text" id="address" name="address" [(ngModel)]="formValues.address" required
          class="form-control"
          placeholder="Ej: Calle Falsa 123">
      </div>

      <div class="grid grid-cols-2 gap-4">
        <div class="form-group">
          <label for="city" class="form-label">Ciudad</label>
          <input type="text" id="city" name="city" [(ngModel)]="formValues.city" required
            class="form-control"
            placeholder="Ej: CABA">
        </div>
        <div class="form-group">
          <label for="state" class="form-label">Provincia/Estado</label>
          <input type="text" id="state" name="state" [(ngModel)]="formValues.state" required
            class="form-control"
            placeholder="Ej: Buenos Aires">
        </div>
      </div>

      <div class="form-group">
        <label for="country" class="form-label">País</label>
        <input type="text" id="country" name="country" [(ngModel)]="formValues.country" required
          class="form-control"
          placeholder="Ej: Argentina">
      </div>
    </div>
  </div>

  <!-- Botones -->
  <div class="flex gap-3 justify-end pt-4 border-t border-[var(--color-border)]">
    <button type="button" (click)="onCancel()" class="btn btn-secondary">
      Cancelar
    </button>
    <button type="submit" [disabled]="!form.valid" class="btn btn-primary">
      {{ buttonLabel }}
    </button>
  </div>
</form>
