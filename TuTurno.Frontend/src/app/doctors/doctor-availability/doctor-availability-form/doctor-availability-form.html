<div class="form-container">
  <div class="flex flex-col gap-8">
    <!-- Header -->
    <div class="flex justify-between items-center border-b border-[var(--color-border)] pb-4">
      <div>
        <h2 class="text-xl font-bold text-[var(--color-text-main)]">Configurar Horarios Semanales</h2>
        <p class="text-sm text-[var(--color-text-muted)]">Habilita los días y define los rangos de atención</p>
      </div>
      <div class="flex gap-3">
        <button (click)="onCancel()" class="btn-cancel">Cancelar</button>
        <button (click)="onSubmit()" class="btn-save">Guardar Cambios</button>
      </div>
    </div>

    <!-- Grid de Días -->
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4">
      @for (day of daySelections; track day.dayId) {
        <div 
          class="day-card group"
          [ngClass]="{'active': day.enabled, 'weekend': day.isWeekend}"
          (click)="!day.enabled && toggleDay(day)"
        >
          <!-- Card Header -->
          <div class="flex justify-between items-center mb-4">
            <span class="font-bold text-lg" [ngClass]="day.enabled ? 'text-[var(--color-primary)]' : 'text-[var(--color-text-muted)]'">
              {{ day.dayName }}
            </span>
            <div class="toggle-switch" (click)="$event.stopPropagation(); toggleDay(day)">
              <input type="checkbox" [checked]="day.enabled">
              <span class="slider"></span>
            </div>
          </div>

          <!-- Time Inputs (solo si está habilitado) -->
          <div class="time-inputs" [ngClass]="{'visible': day.enabled}">
            <div class="flex flex-col gap-3">
              <div class="flex items-center gap-3">
                <span class="text-xs font-semibold text-[var(--color-text-muted)] w-12 uppercase">Inicio</span>
                <input 
                  type="time" 
                  [(ngModel)]="day.startTime" 
                  class="time-field"
                  (click)="$event.stopPropagation()"
                >
              </div>
              <div class="flex items-center gap-3">
                <span class="text-xs font-semibold text-[var(--color-text-muted)] w-12 uppercase">Fin</span>
                <input 
                  type="time" 
                  [(ngModel)]="day.endTime" 
                  class="time-field"
                  (click)="$event.stopPropagation()"
                >
              </div>
            </div>
          </div>

          <!-- Placeholder si no está habilitado -->
          @if (!day.enabled) {
            <div class="flex items-center justify-center h-[76px] border-2 border-dashed border-[var(--color-border)] rounded-xl opacity-40">
              <span class="text-xs font-medium italic">Día no laborable</span>
            </div>
          }
        </div>
      }
    </div>
  </div>
</div>
