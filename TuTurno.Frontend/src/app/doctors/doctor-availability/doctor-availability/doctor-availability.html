<div class="page-container">
  <div class="flex flex-col gap-6">
    <!-- Header con Filtros -->
    <div class="bg-[var(--color-bg-secondary)] p-6 rounded-2xl border border-[var(--color-border)] shadow-sm">
      <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
        <div class="flex flex-col gap-1">
          <h1 class="text-title font-bold text-[var(--color-text-main)]">Disponibilidad Médica</h1>
          <p class="text-muted">Gestiona los horarios semanales de los doctores</p>
        </div>

        <div class="flex flex-wrap items-center gap-3 w-full md:w-auto">
          <div class="relative flex-1 md:flex-none md:min-w-[250px]">
            <select 
              [(ngModel)]="selectedDoctorId" 
              class="input-field pr-10 appearance-none"
              [disabled]="loading()"
            >
              <option value="" disabled selected>Seleccione un doctor</option>
              @for (doctor of doctors(); track doctor.id) {
                <option [value]="doctor.id">{{ doctor.name }}</option>
              }
            </select>
            <div class="absolute right-3 top-1/2 -translate-y-1/2 pointer-events-none text-muted">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/>
              </svg>
            </div>
          </div>

          <button 
            (click)="consultAvailability()" 
            class="btn-secondary flex items-center gap-2"
            [disabled]="loading() || !selectedDoctorId()"
          >
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
            </svg>
            Consultar
          </button>

          <button 
            (click)="onAdd()" 
            class="btn-primary flex items-center gap-2"
            [disabled]="loading() || !selectedDoctorId()"
          >
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/>
            </svg>
            Agregar Horarios
          </button>
        </div>
      </div>
    </div>

    <!-- Contenido Principal -->
    <div class="relative min-h-[400px]">
      @if (loading()) {
        <div class="absolute inset-0 bg-[var(--color-bg-main)]/50 backdrop-blur-[1px] z-10 flex items-center justify-center rounded-2xl">
          <div class="flex flex-col items-center gap-3">
            <div class="w-10 h-10 border-4 border-[var(--color-primary)] border-t-transparent rounded-full animate-spin"></div>
            <span class="text-sm font-medium text-[var(--color-text-muted)]">Cargando...</span>
          </div>
        </div>
      }

      @if (mode() === 'list') {
        <app-doctor-availability-list 
          [slots]="availabilitySlots()" 
          [weekdays]="weekdays()"
          (deleteSlot)="onDelete($event)"
        ></app-doctor-availability-list>
      } @else {
        <app-doctor-availability-form 
          [doctors]="doctors()" 
          [weekdays]="weekdays()" 
          [initialDoctorId]="selectedDoctorId()"
          (save)="onSave($event)"
          (cancel)="onCancel()"
        ></app-doctor-availability-form>
      }
    </div>
  </div>
</div>
