<div class="space-y-6 animate-in fade-in duration-700">
    @switch (mode()) {
        @case ('create') {
            <app-doctors-form></app-doctors-form>
        }
        @default {
            <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 bg-white p-6 rounded-2xl border border-[var(--color-border)] shadow-sm">
                <div>
                    <h1 class="text-2xl font-bold text-[var(--color-text-main)] tracking-tight">Directorio de Médicos</h1>
                    <p class="text-[var(--color-text-muted)] text-sm font-medium">Panel de administración para la gestión y consulta de especialistas.</p>
                </div>
                <button (click)="onNuevoMedico()" 
                    class="flex items-center justify-center gap-2 bg-[var(--color-primary)] hover:bg-[var(--color-primary-dark)] text-white px-6 py-2.5 rounded-xl font-bold transition-all shadow-lg shadow-sky-100 hover:-translate-y-0.5 active:translate-y-0">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path>
                    </svg>
                    Nuevo Médico
                </button>
            </div>
        
            <!-- Main Filter Card -->
            <div class="bg-white rounded-2xl shadow-xl border border-[var(--color-border)] overflow-hidden">
                <div class="bg-gradient-to-r from-slate-50 to-white border-b border-[var(--color-border)] p-6">
                    <div class="flex items-center gap-3">
                        <div class="p-2 bg-sky-50 rounded-lg text-[var(--color-primary)]">
                            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
                            </svg>
                        </div>
                        <h2 class="font-bold text-lg text-[var(--color-text-main)]">Filtros de Búsqueda</h2>
                    </div>
                </div>
        
                <div class="p-8">
                    <div class="grid grid-cols-1 gap-8">
                        <!-- Specialty Selection -->
                        <div class="space-y-3">
                            <label for="specialty" class="block text-sm font-bold text-[var(--color-text-main)] ml-1">
                                Especialidad Médica
                            </label>
                            
                            <div class="relative group">
                                <!-- Icon Prefix -->
                                <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-gray-400 group-focus-within:text-[var(--color-primary)] transition-colors">
                                    <svg *ngIf="!loading()" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19.428 15.428a2 2 0 00-1.022-.547l-2.387-.477a6 6 0 00-3.86.517l-.318.158a6 6 0 01-3.86.517L6.05 15.21a2 2 0 00-1.806.547M8 4h8l-1 1v5.172a2 2 0 00.586 1.414l5 5c1.26 1.26.367 3.414-1.415 3.414H4.828c-1.782 0-2.674-2.154-1.414-3.414l5-5A2 2 0 009 10.172V5L8 4z"></path>
                                    </svg>
                                    <!-- Loading Spinner -->
                                    <svg *ngIf="loading()" class="animate-spin h-5 w-5 text-[var(--color-primary)]" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                                        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                                        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                                    </svg>
                                </div>
        
                                <!-- Custom Select -->
                                <select id="specialty" name="specialty" [disabled]="loading()"
                                    [(ngModel)]="selectedSpecialtyId"
                                    (ngModelChange)="selectedSpecialtyId.set($event)"
                                    class="block w-full pl-12 pr-10 py-4 bg-gray-50 border border-[var(--color-border)] rounded-2xl text-[var(--color-text-main)] font-medium focus:ring-4 focus:ring-[var(--color-primary)]/10 focus:border-[var(--color-primary)] focus:bg-white transition-all appearance-none cursor-pointer hover:border-[var(--color-primary-light)] disabled:opacity-50 disabled:cursor-not-allowed">
                                    <option [value]="null" disabled selected>{{ loading() ? 'Cargando especialidades...' : 'Seleccione una especialidad para filtrar...' }}</option>
                                    <option *ngFor="let specialty of specialties" [value]="specialty.id" 
                                        class="py-3 px-4 bg-white text-[var(--color-text-main)] hover:bg-sky-50">
                                        {{ specialty.name }}
                                    </option>
                                </select>
        
                                <!-- Custom Chevron Arrow -->
                                <div class="absolute inset-y-0 right-0 pr-4 flex items-center pointer-events-none text-[var(--color-primary)]">
                                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
                                    </svg>
                                </div>
                            </div>
                        </div>
                    </div>
        
                    <!-- Footer Action Section -->
                    <div class="mt-10 flex flex-col items-center border-t border-gray-100 pt-8">
                        <button type="button" (click)="onConsultar()"
                            class="group w-full md:w-64 flex items-center justify-center gap-3 py-4 px-8 border-transparent text-base font-bold rounded-2xl text-white bg-gradient-to-r from-[var(--color-primary)] to-[var(--color-primary-dark)] hover:from-[var(--color-primary-dark)] hover:to-[var(--color-primary-dark)] focus:outline-none focus:ring-4 focus:ring-[var(--color-primary)]/40 transition-all shadow-xl shadow-sky-100/50 active:scale-[0.98]">
                            <svg class="w-5 h-5 group-hover:scale-110 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                            </svg>
                            Consultar Médicos
                        </button>
                        
                        <p class="mt-4 text-xs text-[var(--color-text-muted)] font-medium flex items-center gap-2">
                            <svg class="w-4 h-4 text-amber-500" fill="currentColor" viewBox="0 0 20 20">
                                <path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7-4a1 1 0 11-2 0 1 1 0 012 0zM9 9a1 1 0 000 2v3a1 1 0 001 1h1a1 1 0 100-2v-3a1 1 0 00-1-1H9z" clip-rule="evenodd"></path>
                            </svg>
                            Selecciona una especialidad para ver el listado de médicos disponibles.
                        </p>
                    </div>
                </div>
            </div>
        }
    <!-- Header Section -->
    }
</div>
