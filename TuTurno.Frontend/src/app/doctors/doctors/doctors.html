<div class="page-container">
  <div class="card">
    <div class="card-header flex-col sm:flex-row gap-4">
      <h2 class="text-title">Médicos</h2>
      <div class="flex flex-col gap-2 sm:flex-row">
        <button (click)="onAddDoctor()" class="btn btn-primary">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/>
          </svg>
          Nuevo
        </button>
        <button (click)="getDoctors()" class="btn btn-secondary">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5"/>
          </svg>
          Consultar
        </button>
      </div>
    </div>
    <div class="card-body">
      @switch (mode()) {
        @case ('list') {
          <app-doctors-list
            [doctors]="doctors()"
            (delete)="deleteDoctor($event)"
            (updateDoctor)="onEditDoctor($event)"
          ></app-doctors-list>
        }
        @case ('create') {
          <app-doctors-form
            [mode]="'create'"
            (createDoctor)="createDoctor($event)"
            (cancel)="onCancel('list')"
          ></app-doctors-form>
        }
        @case ('update') {
          <app-doctors-form
            [mode]="'update'"
            (cancel)="onCancel('list')"
            (updateDoctor)="updateDoctor($event)"
          ></app-doctors-form>
        }
        @default {
          <app-doctors-list [doctors]="doctors()"></app-doctors-list>
        }
      }
    </div>
  </div>
</div>
