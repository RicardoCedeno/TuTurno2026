<form class="space-y-6 animate-fade-in" #form="ngForm" (ngSubmit)="onSubmit(form)">
  <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
    <!-- Información Personal -->
    <div class="space-y-4">
      <h3 class="text-subtitle font-medium text-[var(--color-primary-dark)] border-b border-[var(--color-border)] pb-2">Información Personal</h3>
      
      <div class="form-group">
        <label for="id" class="form-label">Documento de Identidad</label>
        <input type="text" id="id" name="id" [(ngModel)]="formValues.id" required
          [disabled]="mode() === 'update'"
          class="form-control disabled:bg-[var(--color-bg-main)] disabled:opacity-70"
          placeholder="Ej: 12345678">
      </div>

      <div class="form-group">
        <label for="name" class="form-label">Nombre Completo</label>
        <input type="text" id="name" name="name" [(ngModel)]="formValues.name" required
          class="form-control"
          placeholder="Ej: Dr. Juan Pérez">
      </div>

      <div class="form-group">
        <label for="email" class="form-label">Correo Electrónico</label>
        <input type="email" id="email" name="email" [(ngModel)]="formValues.email" required email
          class="form-control"
          placeholder="juan.perez@ejemplo.com">
      </div>

      <div class="form-group">
        <label for="phone" class="form-label">Teléfono</label>
        <input type="text" id="phone" name="phone" [(ngModel)]="formValues.phone" required
          class="form-control"
          placeholder="+54 11 1234-5678">
      </div>
    </div>

    <!-- Ubicación -->
    <div class="space-y-4">
      <h3 class="text-subtitle font-medium text-[var(--color-primary-dark)] border-b border-[var(--color-border)] pb-2">Ubicación</h3>
      
      <div class="form-group">
        <label for="address" class="form-label">Dirección</label>
        <input type="text" id="address" name="address" [(ngModel)]="formValues.address" required
          class="form-control"
          placeholder="Av. Siempre Viva 123">
      </div>

      <div class="grid grid-cols-2 gap-4">
        <div class="form-group">
          <label for="city" class="form-label">Ciudad</label>
          <input type="text" id="city" name="city" [(ngModel)]="formValues.city" required
            class="form-control"
            placeholder="CABA">
        </div>
        <div class="form-group">
          <label for="state" class="form-label">Provincia/Estado</label>
          <input type="text" id="state" name="state" [(ngModel)]="formValues.state" required
            class="form-control"
            placeholder="Buenos Aires">
        </div>
      </div>

      <div class="form-group">
        <label for="country" class="form-label">País</label>
        <input type="text" id="country" name="country" [(ngModel)]="formValues.country" required
          class="form-control"
          placeholder="Argentina">
      </div>
    </div>
  </div>

  <!-- Especialidades -->
  <div class="space-y-4">
    <h3 class="text-subtitle font-medium text-[var(--color-primary-dark)] border-b border-[var(--color-border)] pb-2">Especialidades</h3>
    <div class="flex flex-wrap gap-2">
      @for (specialty of specialties(); track specialty.id) {
        <button type="button" (click)="toggleSpecialty(specialty)"
          [class]="isSpecialtySelected(specialty.id) 
            ? 'px-4 py-2 rounded-full bg-[var(--color-primary)] text-[var(--color-text-inverse)] border border-[var(--color-primary)]' 
            : 'px-4 py-2 rounded-full bg-[var(--color-bg-card)] text-[var(--color-text-main)] border border-[var(--color-border)] hover:border-[var(--color-primary)]'"
          class="transition-all text-sm font-medium">
          {{ specialty.name }}
        </button>
      } @empty {
        <p class="text-muted italic">No hay especialidades disponibles.</p>
      }
    </div>
  </div>

  <!-- Botones -->
  <div class="flex gap-3 justify-end pt-4 border-t border-[var(--color-border)]">
    <button type="button" (click)="onCancel()" class="btn btn-secondary">
      Cancelar
    </button>
    <button type="submit" [disabled]="!form.valid" class="btn btn-primary">
      {{ buttonLabel }}
    </button>
  </div>
</form>
