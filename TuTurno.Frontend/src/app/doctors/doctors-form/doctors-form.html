<form class="space-y-6" #form="ngForm" (ngSubmit)="onSubmit(form)">
  <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
    <!-- Información Personal -->
    <div class="space-y-4">
      <h3 class="text-lg font-medium text-[var(--color-primary-dark)] border-b pb-2">Información Personal</h3>
      
      <div>
        <label for="id" class="block text-sm font-medium text-[var(--color-text-main)] mb-1">Documento de Identidad</label>
        <input type="text" id="id" name="id" [(ngModel)]="formValues.id" required
          [disabled]="mode() === 'update'"
          class="block w-full px-4 py-2 rounded-lg border border-[var(--color-border)] focus:ring-2 focus:ring-[var(--color-primary)] outline-none disabled:bg-gray-100"
          placeholder="Ej: 12345678">
      </div>

      <div>
        <label for="name" class="block text-sm font-medium text-[var(--color-text-main)] mb-1">Nombre Completo</label>
        <input type="text" id="name" name="name" [(ngModel)]="formValues.name" required
          class="block w-full px-4 py-2 rounded-lg border border-[var(--color-border)] focus:ring-2 focus:ring-[var(--color-primary)] outline-none"
          placeholder="Ej: Dr. Juan Pérez">
      </div>

      <div>
        <label for="email" class="block text-sm font-medium text-[var(--color-text-main)] mb-1">Correo Electrónico</label>
        <input type="email" id="email" name="email" [(ngModel)]="formValues.email" required email
          class="block w-full px-4 py-2 rounded-lg border border-[var(--color-border)] focus:ring-2 focus:ring-[var(--color-primary)] outline-none"
          placeholder="juan.perez@ejemplo.com">
      </div>

      <div>
        <label for="phone" class="block text-sm font-medium text-[var(--color-text-main)] mb-1">Teléfono</label>
        <input type="text" id="phone" name="phone" [(ngModel)]="formValues.phone" required
          class="block w-full px-4 py-2 rounded-lg border border-[var(--color-border)] focus:ring-2 focus:ring-[var(--color-primary)] outline-none"
          placeholder="+54 11 1234-5678">
      </div>
    </div>

    <!-- Ubicación -->
    <div class="space-y-4">
      <h3 class="text-lg font-medium text-[var(--color-primary-dark)] border-b pb-2">Ubicación</h3>
      
      <div>
        <label for="address" class="block text-sm font-medium text-[var(--color-text-main)] mb-1">Dirección</label>
        <input type="text" id="address" name="address" [(ngModel)]="formValues.address" required
          class="block w-full px-4 py-2 rounded-lg border border-[var(--color-border)] focus:ring-2 focus:ring-[var(--color-primary)] outline-none"
          placeholder="Av. Siempre Viva 123">
      </div>

      <div class="grid grid-cols-2 gap-4">
        <div>
          <label for="city" class="block text-sm font-medium text-[var(--color-text-main)] mb-1">Ciudad</label>
          <input type="text" id="city" name="city" [(ngModel)]="formValues.city" required
            class="block w-full px-4 py-2 rounded-lg border border-[var(--color-border)] focus:ring-2 focus:ring-[var(--color-primary)] outline-none"
            placeholder="CABA">
        </div>
        <div>
          <label for="state" class="block text-sm font-medium text-[var(--color-text-main)] mb-1">Provincia/Estado</label>
          <input type="text" id="state" name="state" [(ngModel)]="formValues.state" required
            class="block w-full px-4 py-2 rounded-lg border border-[var(--color-border)] focus:ring-2 focus:ring-[var(--color-primary)] outline-none"
            placeholder="Buenos Aires">
        </div>
      </div>

      <div>
        <label for="country" class="block text-sm font-medium text-[var(--color-text-main)] mb-1">País</label>
        <input type="text" id="country" name="country" [(ngModel)]="formValues.country" required
          class="block w-full px-4 py-2 rounded-lg border border-[var(--color-border)] focus:ring-2 focus:ring-[var(--color-primary)] outline-none"
          placeholder="Argentina">
      </div>
    </div>
  </div>

  <!-- Especialidades -->
  <div class="space-y-4">
    <h3 class="text-lg font-medium text-[var(--color-primary-dark)] border-b pb-2">Especialidades</h3>
    <div class="flex flex-wrap gap-2">
      @for (specialty of specialties(); track specialty.id) {
        <button type="button" (click)="toggleSpecialty(specialty)"
          [class]="isSpecialtySelected(specialty.id) 
            ? 'px-4 py-2 rounded-full bg-[var(--color-primary)] text-white border border-[var(--color-primary)]' 
            : 'px-4 py-2 rounded-full bg-white text-[var(--color-text-main)] border border-[var(--color-border)] hover:border-[var(--color-primary)]'"
          class="transition-all text-sm font-medium">
          {{ specialty.name }}
        </button>
      } @empty {
        <p class="text-sm text-[var(--color-text-muted)] italic">No hay especialidades disponibles.</p>
      }
    </div>
  </div>

  <!-- Botones -->
  <div class="flex gap-3 justify-end pt-4 border-t">
    <button type="button" (click)="onCancel()"
      class="px-6 py-2 rounded-lg font-medium bg-gray-100 text-gray-700 hover:bg-gray-200 transition-colors">
      Cancelar
    </button>
    <button type="submit" [disabled]="!form.valid"
      class="px-6 py-2 rounded-lg font-medium bg-[var(--color-primary)] text-white hover:bg-[var(--color-primary-dark)] disabled:opacity-50 disabled:cursor-not-allowed transition-colors shadow-sm">
      {{ buttonLabel }}
    </button>
  </div>
</form>
