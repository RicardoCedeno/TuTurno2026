<div class="max-w-4xl mx-auto p-4 animate-in fade-in slide-in-from-bottom-4 duration-700">
    <!-- Header Card -->
    <div class="bg-white rounded-3xl shadow-xl border border-[var(--color-border)] overflow-hidden mb-8">
        <div class="bg-gradient-to-r from-[var(--color-primary)] to-[var(--color-primary-dark)] p-8 text-white">
            <div class="flex items-center gap-5">
                <div class="p-4 bg-white/20 backdrop-blur-lg rounded-2xl shadow-inner border border-white/30">
                    <svg class="w-10 h-10" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
                    </svg>
                </div>
                <div>
                    <h1 class="text-3xl font-extrabold tracking-tight">Registro de Médico</h1>
                    <p class="text-sky-100 font-medium opacity-90 mt-1">Ingresa la información detallada del nuevo especialista.</p>
                </div>
            </div>
        </div>

        <form (ngSubmit)="onSubmit()" #doctorForm="ngForm" class="p-8 lg:p-10 space-y-10">
            <!-- Information Grid -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
                
                <!-- Full Name -->
                <div class="space-y-2">
                    <label class="flex items-center gap-2 text-sm font-bold text-[var(--color-text-main)] ml-1">
                        <svg class="w-4 h-4 text-[var(--color-primary)]" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
                        Nombre Completo
                    </label>
                    <input type="text" name="name" [(ngModel)]="formValues.name" required placeholder="Ej: Dr. Juan Pérez"
                        class="w-full px-5 py-3.5 bg-gray-50 border border-[var(--color-border)] rounded-2xl focus:ring-4 focus:ring-[var(--color-primary)]/10 focus:border-[var(--color-primary)] focus:bg-white transition-all outline-none font-medium">
                </div>

                <!-- Email -->
                <div class="space-y-2">
                    <label class="flex items-center gap-2 text-sm font-bold text-[var(--color-text-main)] ml-1">
                        <svg class="w-4 h-4 text-[var(--color-primary)]" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path></svg>
                        Correo Electrónico
                    </label>
                    <input type="email" name="email" [(ngModel)]="formValues.email" required placeholder="juan.perez@example.com"
                        class="w-full px-5 py-3.5 bg-gray-50 border border-[var(--color-border)] rounded-2xl focus:ring-4 focus:ring-[var(--color-primary)]/10 focus:border-[var(--color-primary)] focus:bg-white transition-all outline-none font-medium">
                </div>

                <!-- Phone -->
                <div class="space-y-2">
                    <label class="flex items-center gap-2 text-sm font-bold text-[var(--color-text-main)] ml-1">
                        <svg class="w-4 h-4 text-[var(--color-primary)]" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"></path></svg>
                        Teléfono
                    </label>
                    <input type="tel" name="phone" [(ngModel)]="formValues.phone" required placeholder="+52 123 456 7890"
                        class="w-full px-5 py-3.5 bg-gray-50 border border-[var(--color-border)] rounded-2xl focus:ring-4 focus:ring-[var(--color-primary)]/10 focus:border-[var(--color-primary)] focus:bg-white transition-all outline-none font-medium">
                </div>

                <!-- City -->
                <div class="space-y-2">
                    <label class="flex items-center gap-2 text-sm font-bold text-[var(--color-text-main)] ml-1">
                        <svg class="w-4 h-4 text-[var(--color-primary)]" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"></path></svg>
                        Ciudad
                    </label>
                    <input type="text" name="city" [(ngModel)]="formValues.city" required placeholder="Ciudad de México"
                        class="w-full px-5 py-3.5 bg-gray-50 border border-[var(--color-border)] rounded-2xl focus:ring-4 focus:ring-[var(--color-primary)]/10 focus:border-[var(--color-primary)] focus:bg-white transition-all outline-none font-medium">
                </div>

                <!-- State -->
                <div class="space-y-2">
                    <label class="flex items-center gap-2 text-sm font-bold text-[var(--color-text-main)] ml-1">
                        <svg class="w-4 h-4 text-[var(--color-primary)]" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
                        Estado / Provincia
                    </label>
                    <input type="text" name="state" [(ngModel)]="formValues.state" required placeholder="CDMX"
                        class="w-full px-5 py-3.5 bg-gray-50 border border-[var(--color-border)] rounded-2xl focus:ring-4 focus:ring-[var(--color-primary)]/10 focus:border-[var(--color-primary)] focus:bg-white transition-all outline-none font-medium">
                </div>

                <!-- Country -->
                <div class="space-y-2">
                    <label class="flex items-center gap-2 text-sm font-bold text-[var(--color-text-main)] ml-1">
                        <svg class="w-4 h-4 text-[var(--color-primary)]" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3.055 11H5a2 2 0 012 2v1a2 2 0 002 2 2 2 0 012 2v2.945M8 3.935V5.5A2.5 2.5 0 0010.5 8h.5a2 2 0 012 2 2 2 0 104 0 2 2 0 012-2h1.064M15 20.488V18a2 2 0 012-2h3.064M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                        País
                    </label>
                    <input type="text" name="country" [(ngModel)]="formValues.country" required placeholder="México"
                        class="w-full px-5 py-3.5 bg-gray-50 border border-[var(--color-border)] rounded-2xl focus:ring-4 focus:ring-[var(--color-primary)]/10 focus:border-[var(--color-primary)] focus:bg-white transition-all outline-none font-medium">
                </div>

                <!-- Address (Full Width) -->
                <div class="space-y-2 md:col-span-2">
                    <label class="flex items-center gap-2 text-sm font-bold text-[var(--color-text-main)] ml-1">
                        <svg class="w-4 h-4 text-[var(--color-primary)]" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"></path></svg>
                        Dirección del Consultorio
                    </label>
                    <input type="text" name="address" [(ngModel)]="formValues.address" required placeholder="Av. Insurgentes Sur 1234, Col. Del Valle"
                        class="w-full px-5 py-3.5 bg-gray-50 border border-[var(--color-border)] rounded-2xl focus:ring-4 focus:ring-[var(--color-primary)]/10 focus:border-[var(--color-primary)] focus:bg-white transition-all outline-none font-medium">
                </div>
            </div>

            <!-- Specialties Multi-Select Section -->
            <div class="space-y-6 pt-6 border-t border-gray-100">
                <div class="flex items-center justify-between">
                    <label class="flex items-center gap-3 text-lg font-bold text-[var(--color-text-main)]">
                        <div class="p-2 bg-sky-50 rounded-lg text-[var(--color-primary)]">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 012-2h2a2 2 0 012 2"></path></svg>
                        </div>
                        Especialidades Médicas
                    </label>
                    <span class="text-xs font-bold text-[var(--color-text-muted)] bg-gray-100 px-3 py-1 rounded-full uppercase tracking-wider">
                        {{formValues.doctorSpecialties?.length || 0}} seleccionadas
                    </span>
                </div>

                <!-- Custom Multi-select Grid -->
                <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
                    <div *ngIf="loadingSpecialties()" class="col-span-full py-10 flex flex-col items-center justify-center space-y-3 opacity-60">
                        <svg class="animate-spin h-8 w-8 text-[var(--color-primary)]" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                        </svg>
                        <p class="text-sm font-medium">Cargando catálogo...</p>
                    </div>

                    <button type="button" *ngFor="let s of specialties()" 
                        (click)="toggleSpecialty(s)"
                        [class.border-[var(--color-primary)]]="isSpecialtySelected(s.id)"
                        [class.bg-sky-50]="isSpecialtySelected(s.id)"
                        [class.text-[var(--color-primary-dark)]]="isSpecialtySelected(s.id)"
                        class="group flex items-center gap-3 p-4 rounded-2xl border-2 border-gray-100 bg-white hover:border-sky-200 hover:bg-sky-50/50 transition-all text-left">
                        <div class="relative flex items-center justify-center">
                            <div class="w-5 h-5 rounded border-2 border-[var(--color-border)] group-hover:border-[var(--color-primary-light)] transition-colors"
                                [class.bg-[var(--color-primary)]]="isSpecialtySelected(s.id)"
                                [class.border-[var(--color-primary)]]="isSpecialtySelected(s.id)">
                            </div>
                            <svg *ngIf="isSpecialtySelected(s.id)" class="absolute w-4 h-4 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"></path>
                            </svg>
                        </div>
                        <span class="text-sm font-bold truncate">{{s.name}}</span>
                    </button>
                </div>
            </div>

            <!-- Form Actions -->
            <div class="flex flex-col sm:flex-row gap-4 pt-10 border-t border-gray-100">
                <button type="submit" [disabled]="!doctorForm.form.valid"
                    class="flex-1 flex items-center justify-center gap-3 py-4 bg-gradient-to-r from-[var(--color-primary)] to-[var(--color-primary-dark)] text-white font-bold rounded-2xl shadow-xl shadow-sky-100 hover:shadow-sky-200 transition-all active:scale-[0.98] disabled:opacity-50 disabled:cursor-not-allowed">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7H5a2 2 0 00-2 2v9a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-3m-1 4l-3 3m0 0l-3-3m3 3V4"></path></svg>
                    Guardar Médico
                </button>
                <button type="button" (click)="onCancel()"
                    class="flex-1 py-4 bg-gray-50 text-[var(--color-text-muted)] font-bold rounded-2xl hover:bg-gray-100 hover:text-[var(--color-text-main)] transition-all active:scale-[0.98]">
                    Cancelar Operación
                </button>
            </div>
        </form>
    </div>
</div>
