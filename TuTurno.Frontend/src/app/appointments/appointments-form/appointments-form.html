<div class="calendar-container h-[600px] border rounded-xl overflow-hidden shadow-inner bg-gray-50/30">
  <tutu-calendar
    [events]="events()"
    [view]="'week'"
    (eventCreate)="onEventCreate($event)"
    (eventClick)="onEventClick($event)"
    (eventDelete)="onEventDelete($event)"
  ></tutu-calendar>
</div>

@if (showModal()) {
  <div class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/40 backdrop-blur-sm animate-in fade-in duration-200">
    <div class="bg-white w-full max-w-lg rounded-2xl shadow-2xl overflow-hidden animate-in zoom-in-95 duration-200 border border-gray-100">
      <!-- Modal Header -->
      <div class="px-6 py-4 bg-gray-50 border-b flex items-center justify-between">
        <h3 class="text-xl font-bold text-[var(--color-primary-dark)]">
          {{ isEditMode() ? 'Editar Cita' : 'Nueva Cita' }}
        </h3>
        <button (click)="closeModal()" class="text-gray-400 hover:text-gray-600 transition-colors">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
        </button>
      </div>

      <!-- Modal Body -->
      <div class="p-6 space-y-4">
        <div class="grid grid-cols-1 gap-4">
          <!-- Paciente -->
          <div class="space-y-1">
            <label class="text-xs font-bold uppercase tracking-wider text-gray-500 ml-1">Paciente</label>
            <select [(ngModel)]="formModel.patientId" class="w-full px-4 py-2.5 rounded-xl border border-gray-200 focus:ring-2 focus:ring-[var(--color-primary)] outline-none bg-white transition-all">
              <option value="" disabled>Seleccione un paciente</option>
              @for (p of patients(); track p.id) {
                <option [value]="p.id">{{ p.name }}</option>
              }
            </select>
          </div>

          <!-- Doctor -->
          <div class="space-y-1">
            <label class="text-xs font-bold uppercase tracking-wider text-gray-500 ml-1">Doctor</label>
            <select [(ngModel)]="formModel.doctorId" class="w-full px-4 py-2.5 rounded-xl border border-gray-200 focus:ring-2 focus:ring-[var(--color-primary)] outline-none bg-white transition-all">
              <option value="" disabled>Seleccione un doctor</option>
              @for (d of doctors(); track d.id) {
                <option [value]="d.id">{{ d.name }}</option>
              }
            </select>
          </div>

          <!-- Oficina -->
          <div class="space-y-1">
            <label class="text-xs font-bold uppercase tracking-wider text-gray-500 ml-1">Oficina</label>
            <select [(ngModel)]="formModel.officeId" class="w-full px-4 py-2.5 rounded-xl border border-gray-200 focus:ring-2 focus:ring-[var(--color-primary)] outline-none bg-white transition-all">
              <option value="" disabled>Seleccione una oficina</option>
              @for (o of offices(); track o.id) {
                <option [value]="o.id">{{ o.name }} (Piso {{ o.floor }})</option>
              }
            </select>
          </div>

          <div class="grid grid-cols-2 gap-4">
            <div class="space-y-1">
                <label class="text-xs font-bold uppercase tracking-wider text-gray-500 ml-1">Fecha y Hora</label>
                <input type="datetime-local" [ngModel]="dateString()" (ngModelChange)="dateString.set($event)" 
                  class="w-full px-4 py-2.5 rounded-xl border border-gray-200 focus:ring-2 focus:ring-[var(--color-primary)] outline-none bg-white transition-all">
            </div>
            <!-- Duración -->
            <div class="space-y-1">
                <label class="text-xs font-bold uppercase tracking-wider text-gray-500 ml-1">Duración (min)</label>
                <input type="number" [(ngModel)]="formModel.duration" class="w-full px-4 py-2.5 rounded-xl border border-gray-200 focus:ring-2 focus:ring-[var(--color-primary)] outline-none bg-white transition-all">
            </div>
          </div>

          <!-- Estado -->
          <div class="space-y-1">
            <label class="text-xs font-bold uppercase tracking-wider text-gray-500 ml-1">Estado</label>
            <select [(ngModel)]="formModel.status" class="w-full px-4 py-2.5 rounded-xl border border-gray-200 focus:ring-2 focus:ring-[var(--color-primary)] outline-none bg-white transition-all">
              <option value="scheduled">Agendada</option>
              <option value="completed">Completada</option>
              <option value="cancelled">Cancelada</option>
            </select>
          </div>

          <!-- Notas -->
          <div class="space-y-1">
            <label class="text-xs font-bold uppercase tracking-wider text-gray-500 ml-1">Notas</label>
            <textarea [(ngModel)]="formModel.notes" rows="2" placeholder="Opcional..." class="w-full px-4 py-2.5 rounded-xl border border-gray-200 focus:ring-2 focus:ring-[var(--color-primary)] outline-none bg-white transition-all resize-none"></textarea>
          </div>
        </div>
      </div>

      <!-- Modal Footer -->
      <div class="px-6 py-4 bg-gray-50 border-t flex gap-3 justify-end">
        <button (click)="closeModal()" class="px-6 py-2.5 rounded-xl font-bold text-gray-500 hover:bg-gray-200 transition-colors">
          Cancelar
        </button>
        <button (click)="confirm()" class="px-8 py-2.5 rounded-xl font-bold bg-[var(--color-primary)] text-white hover:bg-[var(--color-primary-dark)] transition-colors shadow-lg shadow-sky-200 active:scale-95">
          {{ isEditMode() ? 'Guardar Cambios' : 'Confirmar Cita' }}
        </button>
      </div>
    </div>
  </div>
}
