<div class="calendar-container h-[600px] border border-[var(--color-border)] rounded-xl overflow-hidden shadow-inner bg-[var(--color-bg-main)]">
  <tutu-calendar
    [events]="events()"
    [view]="'week'"
    (eventCreate)="onEventCreate($event)"
    (eventClick)="onEventClick($event)"
    (eventDelete)="onEventDelete($event)"
  ></tutu-calendar>
</div>

@if (showModal()) {
  <div class="modal-overlay">
    <div class="modal-content">
      <!-- Modal Header -->
      <div class="modal-header">
        <h3 class="text-subtitle font-bold text-[var(--color-primary-dark)]">
          {{ isEditMode() ? 'Editar Cita' : 'Nueva Cita' }}
        </h3>
        <button (click)="closeModal()" class="text-[var(--color-text-muted)] hover:text-[var(--color-text-main)] transition-colors">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
        </button>
      </div>

      <!-- Modal Body -->
      <div class="modal-body">
        <div class="grid grid-cols-1 gap-4">
          <!-- Paciente -->
          <div class="form-group">
            <label class="form-label">Paciente</label>
            <select [(ngModel)]="formModel.patientId" class="form-control">
              <option value="" disabled>Seleccione un paciente</option>
              @for (p of patients(); track p.id) {
                <option [value]="p.id">{{ p.name }}</option>
              }
            </select>
          </div>

          <!-- Doctor -->
          <div class="form-group">
            <label class="form-label">Doctor</label>
            <select [(ngModel)]="formModel.doctorId" class="form-control">
              <option value="" disabled>Seleccione un doctor</option>
              @for (d of doctors(); track d.id) {
                <option [value]="d.id">{{ d.name }}</option>
              }
            </select>
          </div>

          <!-- Oficina -->
          <div class="form-group">
            <label class="form-label">Oficina</label>
            <select [(ngModel)]="formModel.officeId" class="form-control">
              <option value="" disabled>Seleccione una oficina</option>
              @for (o of offices(); track o.id) {
                <option [value]="o.id">{{ o.name }} (Piso {{ o.floor }})</option>
              }
            </select>
          </div>

          <div class="grid grid-cols-2 gap-4">
            <div class="form-group">
                <label class="form-label">Fecha y Hora</label>
                <input type="datetime-local" [ngModel]="dateString()" (ngModelChange)="dateString.set($event)" 
                  class="form-control">
            </div>
            <!-- Duración -->
            <div class="form-group">
                <label class="form-label">Duración (min)</label>
                <input type="number" [(ngModel)]="formModel.duration" class="form-control">
            </div>
          </div>

          <!-- Estado -->
          <div class="form-group">
            <label class="form-label">Estado</label>
            <select [(ngModel)]="formModel.status" class="form-control">
              <option value="scheduled">Agendada</option>
              <option value="completed">Completada</option>
              <option value="cancelled">Cancelada</option>
            </select>
          </div>

          <!-- Notas -->
          <div class="form-group">
            <label class="form-label">Notas</label>
            <textarea [(ngModel)]="formModel.notes" rows="2" placeholder="Opcional..." class="form-control resize-none"></textarea>
          </div>
        </div>
      </div>

      <!-- Modal Footer -->
      <div class="modal-footer">
        <button (click)="closeModal()" class="btn btn-secondary">
          Cancelar
        </button>
        <button (click)="confirm()" class="btn btn-primary">
          {{ isEditMode() ? 'Guardar Cambios' : 'Confirmar Cita' }}
        </button>
      </div>
    </div>
  </div>
}
