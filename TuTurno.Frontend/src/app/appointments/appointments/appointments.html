<div class="page-container">
  <div class="card">
    <div class="card-header flex-col sm:flex-row gap-4">
      <h2 class="text-title">Gestión de Citas</h2>
      <div class="flex gap-2">
        <button 
          (click)="changeMode('list')" 
          [class.btn-primary]="mode() === 'list'"
          [class.btn-secondary]="mode() !== 'list'"
          class="btn"
        >
          Ver Calendario
        </button>
        <button 
          (click)="changeMode('create')" 
          [class.btn-primary]="mode() === 'create'"
          [class.btn-secondary]="mode() !== 'create'"
          class="btn"
        >
          Agendar Cita
        </button>
      </div>
    </div>

    <div class="card-body">
      <div [class.hidden]="mode() !== 'list'">
        <app-appointments-list [appointments]="appointments()"></app-appointments-list>
      </div>

      <div [class.hidden]="mode() !== 'create'">
        <app-appointments-form 
          [patients]="patients()" 
          [doctors]="doctors()" 
          [offices]="offices()"
          [appointments]="appointments()"
          (create)="onCreateAppointment($event)"
          (update)="onUpdateAppointment($event)"
          (delete)="onDeleteAppointment($event)"
          (cancel)="changeMode('list')"
        ></app-appointments-form>
      </div>
    </div>
  </div>
</div>
