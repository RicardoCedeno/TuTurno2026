<div class="bg-white p-6 rounded-2xl shadow border border-[var(--color-border)] min-h-[80vh]">
  <div class="flex flex-col gap-4 sm:flex-row sm:items-center sm:justify-between mb-6">
    <h2 class="text-2xl font-semibold text-[var(--color-primary-dark)]">Gestión de Citas</h2>
    <div class="flex gap-2">
      <button 
        (click)="changeMode('list')" 
        [class.bg-[var(--color-primary)]]="mode() === 'list'"
        [class.text-white]="mode() === 'list'"
        class="px-4 py-2 rounded-lg font-medium transition-colors border border-[var(--color-border)]"
      >
        Ver Calendario
      </button>
      <button 
        (click)="changeMode('create')" 
        [class.bg-[var(--color-primary)]]="mode() === 'create'"
        [class.text-white]="mode() === 'create'"
        class="px-4 py-2 rounded-lg font-medium transition-colors border border-[var(--color-border)]"
      >
        Agendar Cita
      </button>
    </div>
  </div>

  <div [class.hidden]="mode() !== 'list'">
    <app-appointments-list [appointments]="appointments()"></app-appointments-list>
  </div>

  <div [class.hidden]="mode() !== 'create'">
    <app-appointments-form 
      [patients]="patients()" 
      [doctors]="doctors()" 
      [offices]="offices()"
      [appointments]="appointments()"
      (create)="onCreateAppointment($event)"
      (update)="onUpdateAppointment($event)"
      (delete)="onDeleteAppointment($event)"
      (cancel)="changeMode('list')"
    ></app-appointments-form>
  </div>
</div>
