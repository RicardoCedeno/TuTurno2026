<form class="space-y-6 animate-fade-in" #form="ngForm" (ngSubmit)="onSubmit(form)">
  <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
    <!-- Información de la Oficina -->
    <div class="space-y-4">
      <h3 class="text-subtitle font-medium text-[var(--color-primary-dark)] border-b border-[var(--color-border)] pb-2">Detalles de la Oficina</h3>

      <div class="form-group">
        <label for="name" class="form-label">Nombre de la Oficina</label>
        <input type="text" id="name" name="name" [(ngModel)]="formValues.name" required
          class="form-control"
          placeholder="Ej: Consultorio 101">
      </div>

      <div class="form-group">
        <label for="floor" class="form-label">Piso</label>
        <input type="text" id="floor" name="floor" [(ngModel)]="formValues.floor"
          class="form-control"
          placeholder="Ej: 1er Piso">
      </div>
    </div>

    <!-- Ubicación y Estado -->
    <div class="space-y-4">
      <h3 class="text-subtitle font-medium text-[var(--color-primary-dark)] border-b border-[var(--color-border)] pb-2">Ubicación y Estado</h3>

      <div class="form-group">
        <label for="locationId" class="form-label">Ubicación (Sede)</label>
        <select id="locationId" name="locationId" [(ngModel)]="formValues.locationId" required
          class="form-control">
          <option value="" disabled selected>Seleccione una sede</option>
          @for (location of locations(); track location.id) {
          <option [value]="location.id">{{ location.name }}</option>
          }
        </select>
      </div>

      <div class="form-group">
        <label for="description" class="form-label">Descripción</label>
        <textarea id="description" name="description" [(ngModel)]="formValues.description" rows="3"
          class="form-control resize-none"
          placeholder="Opcional: Detalles adicionales de la oficina..."></textarea>
      </div>

      <div class="flex items-center gap-3 pt-2">
        <input type="checkbox" id="active" name="active" [(ngModel)]="formValues.active"
          class="w-5 h-5 text-[var(--color-primary)] border-[var(--color-border)] rounded focus:ring-[var(--color-primary)]">
        <label for="active" class="text-sm font-medium text-[var(--color-text-main)]">Oficina Activa</label>
      </div>
    </div>
  </div>

  <!-- Botones -->
  <div class="flex gap-3 justify-end pt-4 border-t border-[var(--color-border)]">
    <button type="button" (click)="onCancel()" class="btn btn-secondary">
      Cancelar
    </button>
    <button type="submit" [disabled]="!form.valid" class="btn btn-primary">
      {{ buttonLabel }}
    </button>
  </div>
</form>
