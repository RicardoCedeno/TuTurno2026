<form class="space-y-6 animate-fade-in" #form="ngForm">
  <input type="hidden" name="id" [(ngModel)]="formValues.id" />
  <div class="form-group">
    <label for="name" class="form-label">
      Nombre de especialidad
    </label>
    <input
      type="text"
      id="name"
      name="name"
      class="form-control"
      placeholder="Ej: Cardiología"
      required
      [(ngModel)]="formValues.name"
      #nameInput="ngModel"
    />
  </div>
  <div class="form-group">
    <div class="flex justify-between items-center mb-1">
      <label for="description" class="form-label !mb-0">
        Descripción
      </label>
      <button 
        type="button" 
        (click)="generateDescription()"
        class="flex items-center gap-1.5 text-xs font-semibold text-[var(--color-primary)] hover:bg-[var(--color-primary-light)] px-2 py-1 rounded-md transition-all border border-[var(--color-primary)] border-opacity-20 hover:border-opacity-100"
        title="Generar con Inteligencia Artificial"
      >
        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.813 15.904L9 18.75l-.813-2.846a4.5 4.5 0 00-3.09-3.09L2.25 12l2.846-.813a4.5 4.5 0 003.09-3.09L9 5.25l.813 2.846a4.5 4.5 0 003.09 3.09L15.75 12l-2.846.813a4.5 4.5 0 00-3.09 3.09zM18.259 8.715L18 9.75l-.259-1.035a3.375 3.375 0 00-2.455-2.456L14.25 6l1.036-.259a3.375 3.375 0 002.455-2.456L18 2.25l.259 1.035a3.375 3.375 0 002.456 2.456L21.75 6l-1.035.259a3.375 3.375 0 00-2.456 2.456zM16.894 20.567L16.5 21.75l-.394-1.183a2.25 2.25 0 00-1.423-1.423L13.5 18.75l1.183-.394a2.25 2.25 0 001.423-1.423l.394-1.183.394 1.183a2.25 2.25 0 001.423 1.423l1.183.394-1.183.394a2.25 2.25 0 00-1.423 1.423z"/>
        </svg>
        <span>Generar con IA</span>
      </button>
    </div>
    <input
      type="text"
      id="description"
      name="description"
      class="form-control"
      placeholder="Breve descripción..."
      required
      [(ngModel)]="formValues.description"
      #descriptionInput="ngModel"
    />
  </div>
  <div class="flex gap-3 justify-end pt-4 border-t border-[var(--color-border)]">
    <button
      type="button"
      class="btn btn-secondary"
      (click)="onCancel()"
    >
      Cancelar
    </button>
    <button
      type="submit"
      class="btn btn-primary"
      [disabled]="!form.valid"
      (click)="onSubmit(form)"
    >
      {{buttonLabel}}
    </button>
  </div>
</form>
