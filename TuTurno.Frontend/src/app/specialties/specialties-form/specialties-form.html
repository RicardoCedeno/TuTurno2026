<form class="space-y-6 animate-fade-in" #form="ngForm">
  <input type="hidden" name="id" [(ngModel)]="formValues.id" />
  <div class="form-group">
    <label for="name" class="form-label">
      Nombre de especialidad
    </label>
    <input
      type="text"
      id="name"
      name="name"
      class="form-control"
      placeholder="Ej: Cardiología"
      required
      [(ngModel)]="formValues.name"
      #nameInput="ngModel"
    />
  </div>
  <div class="form-group">
    <label for="description" class="form-label">
      Descripción
    </label>
    <input
      type="text"
      id="description"
      name="description"
      class="form-control"
      placeholder="Breve descripción..."
      required
      [(ngModel)]="formValues.description"
      #descriptionInput="ngModel"
    />
  </div>
  <div class="flex gap-3 justify-end pt-4 border-t border-[var(--color-border)]">
    <button
      type="button"
      class="btn btn-secondary"
      (click)="onCancel()"
    >
      Cancelar
    </button>
    <button
      type="submit"
      class="btn btn-primary"
      [disabled]="!form.valid"
      (click)="onSubmit(form)"
    >
      {{buttonLabel}}
    </button>
  </div>
</form>
